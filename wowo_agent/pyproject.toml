[project]
name = "wowo-agent"
version = "0.2.0"
description = "A small extensible Python agent with local RAG embeddings and a web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "ezdwg>=0.12.6",
]

[project.scripts]
wowo-agent = "wowo_agent.cli:main"
wowo-web = "wowo_agent.server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
